<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Servicio Express</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f4f7; --card:#fff; --ink:#14171f; --muted:#6b7280; --line:#e4e6eb;
  --brand:#c3002f; --ok:#16a34a; --warn:#f59e0b; --bad:#dc2626; --wait:#64748b;
  --tv-bg:#0a0c11; --tv-card:#141821; --tv-line:#232938; --tv-ink:#f5f7fb; --tv-muted:#8a93a6;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit}
a{color:inherit}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;justify-content:center;white-space:nowrap}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--brand);color:#fff}
.btn.go{background:var(--ok);color:#fff}
.btn.stop{background:var(--ink);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.sm{padding:7px 10px;font-size:13px}
.lnk{border:0;background:none;color:var(--muted);cursor:pointer;padding:2px 4px;font-size:14px}
.center{min-height:100vh;display:grid;place-items:center;padding:24px}
.landing,.login{background:var(--card);border-radius:20px;padding:36px;max-width:640px;width:100%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.06)}
.landing h1,.login h1{margin:0 0 6px}
.landing p,.login p{color:var(--muted)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
.choice{display:flex;flex-direction:column;gap:6px;align-items:center;padding:26px 16px;border:1px solid var(--line);border-radius:16px;text-decoration:none;font-size:34px;transition:.15s}
.choice:hover{border-color:var(--brand);transform:translateY(-2px)}
.choice b{font-size:18px}.choice small{font-size:13px;color:var(--muted)}
.demo{background:#fff7e6;color:#92400e!important;border-radius:10px;padding:10px;font-size:13px;margin-top:18px}
.logo-xl{font-size:46px}

/* ---------- ASESORA ---------- */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{width:38px;height:38px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:20px}
.brand small{display:block;color:var(--muted);font-size:12px}
.top-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.who{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.who input{border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:150px}
.sync{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.sync.err::before{background:var(--bad)}.sync.demo::before{background:var(--warn)}
.wrap{max-width:1280px;margin:0 auto;padding:20px 16px 40px;display:grid;gap:22px}
.panel{background:var(--card);border-radius:16px;padding:18px 20px;border:1px solid var(--line)}
h2{font-size:16px;margin:0 0 12px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec-h span{color:var(--muted);font-size:13px}
.frm{display:flex;gap:12px;max-width:520px}.frm input{flex:1;min-width:0}.frm .btn{padding:0 26px;font-size:16px}
.frm label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
.frm label span{font-weight:400}
.frm input,.frm select{border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--ink);background:#fff;font-size:15px}
#fPlaca{text-transform:uppercase;font-family:"JetBrains Mono",monospace;font-weight:800;letter-spacing:3px;font-size:26px}
.msg{margin:10px 0 0;font-size:14px;min-height:20px;color:var(--ok)}
.msg.err{color:var(--bad)}
.grid-p{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;border-top:5px solid var(--line);min-height:230px}
.pc.libre{align-items:center;justify-content:center;color:var(--muted);border-style:dashed;border-top-style:dashed}
.pc.espera{border-top-color:var(--wait)}
.pc.curso{border-top-color:var(--ok)}
.pc.curso.lv1{border-top-color:var(--warn);background:#fffaf0}
.pc.curso.lv2{border-top-color:var(--bad);background:#fff3f3}
.pc-h{font-size:12px;font-weight:700;color:var(--muted);display:flex;justify-content:space-between;align-items:center;text-transform:uppercase;letter-spacing:.5px}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:#eef1f5;color:var(--wait);text-transform:none;letter-spacing:0}
.pc.curso .tag{background:#e8f7ee;color:var(--ok)}
.pc.lv1 .tag{background:#fff1d6;color:#b45309}.pc.lv2 .tag{background:#fde2e2;color:var(--bad)}
.pc-tec{font-weight:600;font-size:15px}
.pc-tec i{color:var(--muted);font-weight:400}
.pc-placa{font-family:"JetBrains Mono",monospace;font-weight:800;font-size:26px;letter-spacing:2px}
.pc .timer{font-family:"JetBrains Mono",monospace;font-weight:800;font-size:30px;color:var(--ok)}
.pc.espera .timer{color:var(--wait);font-size:22px}
.pc.lv1 .timer{color:#d97706}.pc.lv2 .timer{color:var(--bad)}
.sub{color:var(--muted);font-size:12px}
.bar{height:6px;border-radius:99px;background:#eceef2;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width 1s linear}
.lv1 .bar i{background:var(--warn)}.lv2 .bar i{background:var(--bad)}
.pc-btns{display:flex;gap:6px;margin-top:auto;flex-wrap:wrap}
.pc-btns .btn:first-child{flex:1}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line)}
td.mono{font-family:"JetBrains Mono",monospace;font-weight:700}
.res{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px}
.res.ok{background:#e8f7ee;color:var(--ok)}.res.bad{background:#fde2e2;color:var(--bad)}
.empty{color:var(--muted);font-size:14px;padding:10px 0}
.foot{text-align:center;font-size:12px;color:var(--muted)}
.tblwrap{overflow-x:auto}
@media (max-width:1100px){.grid-p{grid-template-columns:repeat(3,1fr)}}
@media (max-width:640px){.grid-p{grid-template-columns:1fr 1fr}.choices{grid-template-columns:1fr}.who input{width:110px}}

/* ---------- TV ---------- */
body.tvmode{background:var(--tv-bg);color:var(--tv-ink);overflow:hidden}
.tv{height:100vh;display:flex;flex-direction:column;padding:1.6vh 1.4vw;gap:1.4vh}
.tv-top{display:flex;align-items:center;justify-content:space-between;gap:2vw}
.tv-brand{font-size:2.2vw;font-weight:500;letter-spacing:.3vw}
.tv-brand b{color:#ff3b5c;font-weight:800}
.tv-stats{display:flex;gap:2.2vw}
.st{text-align:center}.st b{display:block;font-size:2.2vw;font-family:"JetBrains Mono",monospace}
.st small{font-size:.85vw;color:var(--tv-muted);text-transform:uppercase;letter-spacing:.1vw}
.tv-clock{font-family:"JetBrains Mono",monospace;font-size:2.2vw;color:var(--tv-muted)}
.tv-alert{min-height:0;max-height:0;overflow:hidden;border-radius:12px;background:var(--bad);color:#fff;font-weight:800;font-size:1.5vw;text-align:center;transition:.3s;padding:0 1vw}
.tv-alert.on{max-height:8vh;min-height:5vh;padding:1.2vh 1vw;animation:flash 1s infinite alternate}
@keyframes flash{to{background:#7f1d1d}}
.tv-grid{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:1vw;min-height:0}
.tc{background:var(--tv-card);border:2px solid var(--tv-line);border-radius:1.4vw;padding:2vh 1vw;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2.6vh;position:relative;overflow:hidden;border-top:1vh solid var(--tv-line)}
.tc-p{position:absolute;top:1.6vh;left:0;right:0;font-size:.95vw;letter-spacing:.25vw;color:var(--tv-muted);font-weight:600}
.tc-tec{font-size:2vw;font-weight:800;line-height:1.1;text-transform:uppercase;max-width:100%;overflow-wrap:anywhere}
.tc-placa{font-family:"JetBrains Mono",monospace;font-size:3vw;font-weight:800;letter-spacing:.3vw;background:#f5c518;color:#111;border-radius:.5vw;padding:.4vh .9vw;border:3px solid #111;box-shadow:0 0 0 3px #f5c518}
.tc .timer{font-family:"JetBrains Mono",monospace;font-weight:800;font-size:5vw;line-height:1;color:#22c55e;font-variant-numeric:tabular-nums}
.tc .timer.long{font-size:3.4vw}
.tc .bar{width:90%;height:1.1vh;background:#232938}
.tc .bar i{background:#22c55e}
.tc-sub{font-size:1vw;color:var(--tv-muted);letter-spacing:.05vw}
.tc.libre{opacity:.35;border-style:dashed}
.tc-free{font-size:1.4vw;letter-spacing:.3vw;color:var(--tv-muted)}
.tc.espera{border-top-color:#64748b}
.tc.espera .timer{color:#94a3b8;font-size:3vw}
.tc.curso{border-top-color:#22c55e}
.tc.curso.lv1{border-color:#f59e0b;background:#2a2110}
.tc.curso.lv1 .timer{color:#fbbf24}.tc.lv1 .bar i{background:#f59e0b}
.tc.curso.lv2{border-color:#ef4444;background:#3a1010;animation:pulse 1.1s infinite}
.tc.curso.lv2 .timer{color:#fff}.tc.lv2 .bar i{background:#ef4444}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.0)}50%{box-shadow:0 0 3vw .4vw rgba(239,68,68,.55);background:#5a1212}}
.tv-foot{display:flex;align-items:center;gap:1.5vw;font-size:1vw;color:var(--tv-muted)}
.tv-ult{flex:1;display:flex;gap:1.6vw;overflow:hidden;white-space:nowrap}
.tv-ult span b{color:var(--tv-ink);font-family:"JetBrains Mono",monospace}
.tv-foot button{background:none;border:1px solid var(--tv-line);color:var(--tv-muted);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:1vw}
.tv-foot a{color:var(--tv-muted);text-decoration:none}
.ov{position:fixed;inset:0;background:rgba(5,7,10,.92);display:grid;place-items:center;text-align:center;z-index:9;cursor:pointer}
.ov b{font-size:2.4vw;display:block}.ov small{color:var(--tv-muted);font-size:1.1vw}
.ov-i{font-size:6vw;margin-bottom:2vh}
@media (max-width:900px){body.tvmode{overflow:auto}.tv{height:auto}.tv-grid{grid-template-columns:1fr 1fr}.tc{min-height:260px}}

/* ---------- INICIO: sede / asesora / clave ---------- */
.landing .box{text-align:left;max-width:420px;margin:0 auto}
button.choice{background:#fff;cursor:pointer;font:inherit;font-size:34px;color:var(--ink)}
.box .lnk{align-self:flex-start;padding:0;margin-bottom:-4px}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-top:22px;text-align:left}
.box{border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px}
.box h3{margin:0;font-size:17px;display:flex;align-items:center;gap:8px}
.box p{margin:0;font-size:13px}
.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
.fld select,.fld input{border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:15px;color:var(--ink);background:#fff}
.fld input[type=password]{letter-spacing:4px}
.box .btn{margin-top:auto;padding:12px}
.who-chip{display:inline-flex;align-items:center;gap:8px;background:#f3f4f7;border-radius:99px;padding:6px 12px;font-size:13px}
.who-chip b{color:var(--brand)}
.pc-as{font-size:12px;color:var(--muted)}
.tc-as{font-size:1.1vw;letter-spacing:.2vw;color:var(--tv-muted);text-transform:uppercase}
.tv-sede{color:var(--tv-ink);font-weight:800}
.tv-brand{white-space:nowrap;font-size:1.8vw!important}.tv-clock{white-space:nowrap;font-size:1.8vw!important}.st small{white-space:nowrap}.tv-stats{gap:1.8vw!important}
@media (max-width:720px){.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* =====================================================================
   CONFIGURACIÓN — edita solo este bloque
   ===================================================================== */
const CONFIG = {
  SCRIPT_URL: "https://script.google.com/macros/s/AKfycbykS2g4TsNZP6s8_KWPMOxC9I2HULmYaeZCqqCmqlb0rMAtSgzVhwd9s7_qBD4zsimo/exec",

  SEDES: {
    "Prado":       ["Nain", "Celenia"],
    "Calle 77":    ["Yerseny", "Neguib"],
    "Circunvalar": ["Paola", "Adriana"]
  },
  PUESTOS: 5,                       // máximo de cronómetros por sede
  META_MIN: 90,                     // tiempo meta del servicio express (min)
  AVISO_MIN: 75,                    // pre-alerta amarilla (min)
  REPETIR_ALARMA_MIN: 3,            // repetir sonido de excedido cada X min
  REFRESCO_TV_SEG: 5,               // cada cuántos segundos lee el TV
  REFRESCO_ASESORA_SEG: 10,         // cada cuántos segundos lee la pantalla asesora
  VOZ: true,                        // el TV anuncia por voz las alertas
  DEMO_CLAVE: "1234"                // clave solo para el MODO DEMO
};
/* ===================================================================== */

const DEMO = !CONFIG.SCRIPT_URL;
const SEDES = Object.keys(CONFIG.SEDES);
const app = document.getElementById("app");
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const sleep = ms => new Promise(r => setTimeout(r, ms));
const ls = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const slug = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-");
const sedeDeSlug = x => SEDES.find(s => slug(s) === x) || null;
function fmt(ms){ ms = Math.max(0, ms); const s = Math.floor(ms/1000), h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return h ? `${h}:${pad(m)}:${pad(x)}` : `${pad(m)}:${pad(x)}`; }
function hora(ms){ return ms ? new Date(+ms).toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit"}) : ""; }
function fechaTxt(ms){ const d = new Date(ms); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function esHoy(ms){ return !!ms && new Date(+ms).toDateString() === new Date().toDateString(); }
function nivel(ms){ return ms >= CONFIG.META_MIN*60000 ? 2 : ms >= CONFIG.AVISO_MIN*60000 ? 1 : 0; }
function esActivo(f){ return f.Estado === "ESPERA" || f.Estado === "EN_CURSO"; }
function nuevoId(){ return "X" + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2,5).toUpperCase(); }
function deletrear(p){ return String(p).split("").join(" "); }

/* ---------------- Sesión de la asesora ---------------- */
function leerSesion(){ try { const s = JSON.parse(ls.get("express_sesion")); return s && CONFIG.SEDES[s.sede] ? s : null; } catch(e){ return null; } }
let sesion = leerSesion();
function cerrarSesion(){ sesion = null; ls.del("express_sesion"); location.hash = "#inicio"; }

/* ---------------- Almacenamiento: DEMO (este navegador) ---------------- */
const Demo = {
  key: "express_demo_v2",
  load(){ try { return JSON.parse(ls.get(this.key)) || []; } catch(e){ return []; } },
  save(r){ ls.set(this.key, JSON.stringify(r)); },
  check(c){ if (!c || !CONFIG.SEDES[c.sede] || !CONFIG.SEDES[c.sede].includes(c.asesora) || String(c.clave) !== CONFIG.DEMO_CLAVE) throw new Error("Clave incorrecta."); },
  async login(c){ this.check(c); return true; },
  async listar(sede){ return this.load().filter(f => f.Sede === sede); },
  async nuevo(o, c){
    this.check(c); const r = this.load();
    if (r.some(f => f.ID === o.ID)) return this.listar(c.sede);
    const act = r.filter(esActivo);
    if (act.some(f => String(f.Placa).toUpperCase() === o.Placa)) throw new Error(`La placa ${o.Placa} ya tiene cronómetro.`);
    if (act.filter(f => f.Sede === c.sede).length >= CONFIG.PUESTOS) throw new Error(`Ya hay ${CONFIG.PUESTOS} cronómetros en uso en ${c.sede}.`);
    r.push({ ...o, Sede:c.sede, Asesora:c.asesora }); this.save(r); return this.listar(c.sede);
  },
  async cambiar(id, cambios, esperado, c){
    this.check(c); const r = this.load(), f = r.find(x => x.ID === id && x.Sede === c.sede);
    if (!f) throw new Error("No se encontró el registro. Recarga la página.");
    if (esperado && f.Estado !== esperado && f.Estado !== cambios.Estado) throw new Error("Este servicio ya cambió de estado.");
    Object.assign(f, cambios); this.save(r); return this.listar(c.sede);
  }
};

/* ---------------- Almacenamiento: Google Sheets (Apps Script) ---------------- */
// Google a veces responde con una página de error (HTML) en vez de datos: se trata como fallo temporal
class FalloTemporal extends Error {}
async function leerJSON(r){
  const txt = await r.text();
  if (!r.ok || /^\s*</.test(txt)) throw new FalloTemporal("Google no respondió (" + r.status + ")");
  try { return JSON.parse(txt); } catch(e){ throw new FalloTemporal("Respuesta incompleta de Google"); }
}
async function sheetsPost(body){
  for (let intento = 0; intento < 4; intento++){
    if (intento) await sleep(1500 * intento);
    try {
      const r = await fetch(CONFIG.SCRIPT_URL, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify(body) });
      const d = await leerJSON(r);
      if (!d.ok) throw new Error(d.error || "Error guardando en Google Sheets");
      return d;
    } catch(e){
      if (!(e instanceof FalloTemporal) && !(e instanceof TypeError)) throw e;   // error real: no reintentar
    }
  }
  throw new Error("No se pudo guardar después de varios intentos. Revisa el internet y vuelve a intentarlo.");
}
const cred = c => ({ sede:c.sede, asesora:c.asesora, clave:c.clave });
const Sheets = {
  async login(c){ await sheetsPost({ accion:"login", ...cred(c) }); return true; },
  async listar(sede){
    const r = await fetch(CONFIG.SCRIPT_URL + "?sede=" + encodeURIComponent(sede) + "&t=" + Date.now());
    const d = await leerJSON(r);
    if (d.error) throw new Error(d.error);
    return d.filas;
  },
  async nuevo(o, c){ return (await sheetsPost({ accion:"agregar", ...cred(c), fila:o, max:CONFIG.PUESTOS })).filas; },
  async cambiar(id, cambios, esperado, c){ return (await sheetsPost({ accion:"actualizar", ...cred(c), id, cambios, esperado })).filas; }
};
const store = DEMO ? Demo : Sheets;

/* ---------------- Estado general ---------------- */
let modo = "inicio", sedeActual = null, filas = [], firma = "", cargando = false, ocupado = false, iniciado = false;
let sync = { ok: true, msg: "" };
let conocidos = null;
const niveles = {}, ultAlarma = {};
let versionLocal = 0, fallosSeguidos = 0, ultimaLectura = 0;

function cupos(){
  const a = filas.filter(esActivo).sort((x,y) => x.RegistroMs - y.RegistroMs).slice(0, CONFIG.PUESTOS);
  return Array.from({length:CONFIG.PUESTOS}, (_,i) => a[i] || null);
}
function finalizadosHoy(){ return filas.filter(f => f.Estado === "FINALIZADO" && esHoy(f.FinMs)).sort((a,b) => b.FinMs - a.FinMs); }
function resumenHoy(){
  const fin = finalizadosHoy(), n = fin.length;
  const prom = n ? fin.reduce((s,f) => s + (f.FinMs - f.InicioMs), 0) / n / 60000 : 0;
  const ok = fin.filter(f => (f.FinMs - f.InicioMs) <= CONFIG.META_MIN*60000).length;
  return { n, prom, pct: n ? Math.round(ok/n*100) : 0 };
}

async function refrescar(){
  if (!sedeActual || cargando || ocupado) return; cargando = true;
  const v0 = versionLocal, sede = sedeActual;
  try {
    const nuevas = (await store.listar(sede)).filter(f => f.ID);
    if (v0 === versionLocal && !ocupado && sede === sedeActual) filas = nuevas;   // ignora lecturas viejas
    sync = { ok:true, msg:"" }; fallosSeguidos = 0;
  } catch(e){
    fallosSeguidos++; console.warn(e);
    sync = fallosSeguidos >= 3 ? { ok:false, msg:e.message } : { ok:true, msg:"", reintento:true };
  } finally { cargando = false; }
  pintarSync();
  const sig = JSON.stringify(filas.filter(f => esActivo(f) || esHoy(f.RegistroMs)).map(f => [f.ID,f.Estado,f.Placa]));
  if (sig !== firma){ firma = sig; detectarCambios(); renderDatos(); }
  tick();
}

function pintarSync(){
  const el = $("#sync"); if (!el) return;
  el.className = "sync" + (DEMO ? " demo" : sync.ok ? "" : " err");
  el.textContent = DEMO ? "Modo demo (sin Google Sheets)" : !sync.ok ? "Sin conexión — reintentando… (" + sync.msg + ")" : sync.reintento ? "Reconectando…" : "Conectado a Google Sheets";
  el.title = sync.msg || "";
}

/* ---------------- Sonido y voz ---------------- */
let actx = null, sonidoOn = false;
function activarSonido(){ try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); sonidoOn = true; } catch(e){} }
function tono(freq, dur, when = 0, type = "sine", vol = .4){
  if (!actx || !sonidoOn) return;
  const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + when;
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + .05);
}
const SONIDOS = {
  inicio(){ tono(660,.18); tono(880,.28,.18); },
  aviso(){ [0,.4].forEach(w => tono(880,.28,w,"triangle",.5)); },
  excedido(){ for (let i = 0; i < 8; i++) tono(i%2 ? 740 : 988, .22, i*.26, "square", .3); },
  fin(){ tono(523,.2); tono(659,.2,.18); tono(784,.4,.36); }
};
function hablar(t){
  if (!CONFIG.VOZ || !sonidoOn || !window.speechSynthesis) return;
  setTimeout(() => { const u = new SpeechSynthesisUtterance(t); u.lang = "es-CO"; u.rate = .95; speechSynthesis.speak(u); }, 1300);
}
function detectarCambios(){
  const mapa = {}; filas.forEach(f => mapa[f.ID] = f);
  if (conocidos && modo === "tv"){
    for (const id in mapa){
      const prev = conocidos[id], f = mapa[id];
      if (f.Estado === "EN_CURSO" && prev !== "EN_CURSO"){ SONIDOS.inicio(); hablar(`Inicia servicio express. Placa ${deletrear(f.Placa)}`); }
      if (f.Estado === "FINALIZADO" && prev && prev !== "FINALIZADO"){ SONIDOS.fin(); hablar(`Servicio terminado. Placa ${deletrear(f.Placa)}`); }
    }
  }
  conocidos = {}; for (const id in mapa) conocidos[id] = mapa[id].Estado;
}
function alertar(d, lv, now){
  const id = d.id, prev = niveles[id];
  niveles[id] = lv;
  if (prev === undefined){ if (lv === 2) ultAlarma[id] = now; return; }
  if (lv > prev){
    if (lv === 1){ SONIDOS.aviso(); hablar(`Atención. Placa ${deletrear(d.placa)} lleva ${CONFIG.AVISO_MIN} minutos`); }
    if (lv === 2){ SONIDOS.excedido(); hablar(`Alerta. Placa ${deletrear(d.placa)} superó el tiempo de servicio express`); ultAlarma[id] = now; }
  } else if (lv === 2 && now - (ultAlarma[id] || 0) >= CONFIG.REPETIR_ALARMA_MIN*60000){
    SONIDOS.excedido(); ultAlarma[id] = now;
  }
}

/* ---------------- Reloj de 1 segundo ---------------- */
function tick(){
  const now = Date.now();
  const clk = $("#tvClock"); if (clk) clk.textContent = new Date().toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
  document.querySelectorAll("[data-espera]").forEach(el => { el.querySelector(".timer").textContent = fmt(now - +el.dataset.espera); });
  const exc = [];
  document.querySelectorAll("[data-ini]").forEach(el => {
    const ms = now - +el.dataset.ini, lv = nivel(ms), t = el.querySelector(".timer"), txt = fmt(ms);
    t.textContent = txt; t.classList.toggle("long", txt.length > 5);
    const b = el.querySelector(".bar i"); if (b) b.style.width = Math.min(100, ms / (CONFIG.META_MIN*600)) + "%";
    el.classList.toggle("lv1", lv === 1); el.classList.toggle("lv2", lv === 2);
    const tag = el.querySelector(".tag"); if (tag) tag.textContent = lv === 2 ? "Excedido" : lv === 1 ? "Por vencer" : "En curso";
    if (lv === 2) exc.push(el.dataset);
    if (modo === "tv") alertar(el.dataset, lv, now);
  });
  const a = $("#tvAlert");
  if (a){ a.textContent = exc.map(d => `⚠ ${d.placa} superó ${CONFIG.META_MIN} min`).join("   •   "); a.classList.toggle("on", exc.length > 0); }
}

/* ---------------- Vistas ---------------- */
function montar(){
  firma = ""; conocidos = null; filas = []; versionLocal++;
  document.body.className = modo === "tv" ? "tvmode" : "";
  if (modo === "asesora") montarAsesora();
  else if (modo === "tv") montarTV();
  else montarInicio();
  ultimaLectura = Date.now(); refrescar();
}
const opcionesSede = sel => SEDES.map(s => `<option value="${esc(s)}" ${s === sel ? "selected" : ""}>${esc(s)}</option>`).join("");

function montarInicio(aviso, paso){
  paso = paso || (aviso ? "asesora" : "elegir");
  const ultSede = ls.get("express_ultima_sede") || SEDES[0];
  const demo = DEMO ? `<p class="demo">Modo demo: los datos se guardan solo en este navegador y la clave de todas es ${esc(CONFIG.DEMO_CLAVE)}. Pon tu SCRIPT_URL en la configuración para usar Google Sheets.</p>` : "";
  const volver = `<button type="button" class="lnk" id="btnVolver">← Volver</button>`;

  if (paso === "elegir"){
    app.innerHTML = `<div class="center"><div class="landing">
      <div class="logo-xl">⏱</div><h1>Servicio Express</h1><p>¿Qué pantalla es este equipo?</p>
      <div class="choices">
        <button class="choice" id="chAsesora">🧑‍💼<b>Asesora</b><small>Registrar placa, iniciar y finalizar</small></button>
        <button class="choice" id="chTV">📺<b>Televisor</b><small>Cronómetros grandes con alertas y sonido</small></button>
      </div>${demo}
    </div></div>`;
    $("#chAsesora").onclick = () => montarInicio(null, "asesora");
    $("#chTV").onclick = () => montarInicio(null, "tv");
    return;
  }

  if (paso === "tv"){
    app.innerHTML = `<div class="center"><div class="landing">
      <form class="box" id="frmTV">
        ${volver}
        <h3>📺 Televisor</h3>
        <p>¿De qué sede es este televisor?</p>
        <label class="fld">Sede<select id="tSede">${opcionesSede(ultSede)}</select></label>
        <button class="btn primary" type="submit">Abrir TV de la sede</button>
      </form>
    </div></div>`;
    $("#btnVolver").onclick = () => montarInicio(null, "elegir");
    $("#frmTV").onsubmit = e => { e.preventDefault(); ls.set("express_ultima_sede", $("#tSede").value); location.hash = "#tv/" + slug($("#tSede").value); };
    return;
  }

  // paso "asesora": sede → asesora → clave
  app.innerHTML = `<div class="center"><div class="landing">
    <form class="box" id="frmLogin" autocomplete="off">
      ${volver}
      <h3>🧑‍💼 Asesora</h3>
      <p>Elige tu sede, tu nombre y escribe tu clave</p>
      <label class="fld">Sede<select id="lSede">${opcionesSede(ultSede)}</select></label>
      <label class="fld">Asesora<select id="lAsesora"></select></label>
      <label class="fld">Clave<input id="lClave" type="password" inputmode="numeric" placeholder="••••" autocomplete="off"></label>
      <p id="lMsg" class="msg ${aviso ? "err" : ""}">${esc(aviso || "")}</p>
      <button class="btn primary" id="btnEntrar" type="submit">Entrar</button>
    </form>${demo}
  </div></div>`;
  $("#btnVolver").onclick = () => montarInicio(null, "elegir");
  const llenarAsesoras = () => { $("#lAsesora").innerHTML = CONFIG.SEDES[$("#lSede").value].map(a => `<option>${esc(a)}</option>`).join(""); };
  $("#lSede").onchange = llenarAsesoras;
  llenarAsesoras();
  $("#frmLogin").onsubmit = async e => {
    e.preventDefault();
    const c = { sede:$("#lSede").value, asesora:$("#lAsesora").value, clave:$("#lClave").value.trim() };
    const m = $("#lMsg"), b = $("#btnEntrar");
    if (!c.clave){ m.className = "msg err"; m.textContent = "Escribe tu clave."; return; }
    b.disabled = true; b.textContent = "Verificando…"; m.textContent = "";
    try {
      await store.login(c);
      sesion = c; ls.set("express_sesion", JSON.stringify(c)); ls.set("express_ultima_sede", c.sede);
      location.hash = "#asesora";
    } catch(err){
      m.className = "msg err"; m.textContent = err.message; b.disabled = false; b.textContent = "Entrar";
      $("#lClave").select();
    }
  };
}

function montarAsesora(){
  app.innerHTML = `
  <header class="top">
    <div class="brand"><span class="logo">⏱</span><div><b>Servicio Express · ${esc(sesion.sede)}</b><small>Pantalla asesora</small></div></div>
    <div class="top-r">
      <span class="who-chip">👤 <b>${esc(sesion.asesora)}</b></span>
      <span id="sync" class="sync"></span>
      <a class="btn ghost sm" href="#tv/${slug(sesion.sede)}" target="_blank">Abrir TV ↗</a>
      <button class="btn ghost sm" id="btnSalir">Salir</button>
    </div>
  </header>
  <main class="wrap">
    <section class="panel">
      <h2>1 · Escribe la placa</h2>
      <form id="frm" class="frm" autocomplete="off">
        <input id="fPlaca" maxlength="7" placeholder="ABC123" aria-label="Placa">
        <button class="btn primary" id="btnReg" type="submit">Registrar</button>
      </form>
      <p id="msg" class="msg"></p>
    </section>
    <section>
      <div class="sec-h"><h2>2 · Pulsa ▶ Iniciar al crear la OT y ■ Finalizar al entregar</h2><span id="ocupacion"></span></div>
      <div id="puestos" class="grid-p"></div>
    </section>
    <section class="panel">
      <div class="sec-h"><h2>Atendidos hoy en ${esc(sesion.sede)}</h2><span id="resumen"></span></div>
      <div id="hist" class="tblwrap"></div>
    </section>
    <p class="foot">Meta ${CONFIG.META_MIN} min · alerta amarilla a los ${CONFIG.AVISO_MIN} min</p>
  </main>`;
  $("#btnSalir").onclick = () => { if (confirm(`¿Cerrar la sesión de ${sesion.asesora}?`)) cerrarSesion(); };
  $("#fPlaca").oninput = e => { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, ""); };
  $("#frm").onsubmit = registrar;
  $("#puestos").onclick = e => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const id = b.dataset.id, act = b.dataset.act;
    if (act === "ini") iniciar(id); else if (act === "fin") finalizar(id);
    else if (act === "cancel") cancelar(id);
  };
}

function cardAsesora(p, f){
  if (!f) return `<div class="pc libre"><div>Libre</div></div>`;
  const quien = f.Asesora ? `<div class="pc-as">Registró: ${esc(f.Asesora)}</div>` : "";
  if (f.Estado === "ESPERA") return `<div class="pc espera" data-espera="${+f.RegistroMs}">
      <div class="pc-h">Cupo ${p}<span class="tag">En espera</span></div>
      <div class="pc-placa">${esc(f.Placa)}</div>${quien}<div class="timer">00:00</div><div class="sub">esperando creación de OT</div>
      <div class="pc-btns"><button class="btn go" data-act="ini" data-id="${esc(f.ID)}">▶ Iniciar</button>
      <button class="btn ghost sm" data-act="cancel" data-id="${esc(f.ID)}">Cancelar</button></div></div>`;
  return `<div class="pc curso" data-ini="${+f.InicioMs}" data-id="${esc(f.ID)}" data-placa="${esc(f.Placa)}">
      <div class="pc-h">Cupo ${p}<span class="tag">En curso</span></div>
      <div class="pc-placa">${esc(f.Placa)}</div>${quien}<div class="timer">00:00</div><div class="bar"><i></i></div>
      <div class="sub">inicio ${hora(f.InicioMs)}</div>
      <div class="pc-btns"><button class="btn stop" data-act="fin" data-id="${esc(f.ID)}">■ Finalizar</button>
      <button class="btn ghost sm" data-act="cancel" data-id="${esc(f.ID)}">✕</button></div></div>`;
}

function renderAsesora(){
  const c = cupos(), P = CONFIG.PUESTOS, usados = c.filter(Boolean).length;
  $("#puestos").innerHTML = c.map((f,i) => cardAsesora(i+1, f)).join("");
  $("#btnReg").disabled = usados >= P;
  $("#ocupacion").textContent = `${usados} de ${P} cronómetros en uso`;
  const fin = finalizadosHoy(), r = resumenHoy();
  $("#resumen").textContent = r.n ? `${r.n} atendidos · promedio ${r.prom.toFixed(1)} min · ${r.pct}% a tiempo` : "";
  $("#hist").innerHTML = fin.length ? `<table><thead><tr><th>Placa</th><th>Asesora</th><th>Inicio</th><th>Fin</th><th>Duración</th><th>Resultado</th></tr></thead><tbody>
    ${fin.map(f => { const ms = f.FinMs - f.InicioMs, ok = ms <= CONFIG.META_MIN*60000;
      return `<tr><td class="mono">${esc(f.Placa)}</td><td>${esc(f.Asesora)}</td><td>${hora(f.InicioMs)}</td><td>${hora(f.FinMs)}</td><td class="mono">${fmt(ms)}</td><td><span class="res ${ok ? "ok" : "bad"}">${ok ? "A tiempo" : "Excedido"}</span></td></tr>`; }).join("")}
    </tbody></table>` : `<div class="empty">Aún no hay servicios finalizados hoy.</div>`;
}

function montarTV(){
  app.innerHTML = `<div class="tv">
    <header class="tv-top"><div class="tv-brand">SERVICIO <b>EXPRESS</b> · <span class="tv-sede">${esc(sedeActual.toUpperCase())}</span></div><div class="tv-stats" id="tvStats"></div><div class="tv-clock" id="tvClock"></div></header>
    <div id="tvAlert" class="tv-alert"></div>
    <div id="tvGrid" class="tv-grid"></div>
    <footer class="tv-foot"><span id="sync" class="sync"></span><div id="tvUlt" class="tv-ult"></div>
      <span>Meta ${CONFIG.META_MIN} min</span><button id="btnFs" title="Pantalla completa">⛶</button><a href="#inicio" title="Cambiar sede o pantalla">⚙</a></footer>
    <div id="sonidoOv" class="ov"><div><div class="ov-i">🔊</div><b>Toca la pantalla para activar el sonido</b><small>TV de ${esc(sedeActual)} · el navegador lo exige cada vez que se abre esta pantalla</small></div></div>
  </div>`;
  $("#sonidoOv").onclick = () => { activarSonido(); SONIDOS.inicio(); $("#sonidoOv").remove(); pantallaCompleta(); despierto(); };
  $("#btnFs").onclick = pantallaCompleta;
}
function cardTV(p, f){
  if (!f) return `<div class="tc libre"><div class="tc-free">DISPONIBLE</div></div>`;
  const quien = f.Asesora ? `<div class="tc-as">${esc(f.Asesora)}</div>` : "";
  if (f.Estado === "ESPERA") return `<div class="tc espera" data-espera="${+f.RegistroMs}">
      <div class="tc-placa">${esc(f.Placa)}</div>${quien}<div class="timer">00:00</div><div class="tc-sub">EN ESPERA DE OT</div></div>`;
  return `<div class="tc curso" data-ini="${+f.InicioMs}" data-id="${esc(f.ID)}" data-placa="${esc(f.Placa)}">
      <div class="tc-placa">${esc(f.Placa)}</div>${quien}<div class="timer">00:00</div><div class="bar"><i></i></div>
      <div class="tc-sub">INICIO ${hora(f.InicioMs)}</div></div>`;
}
function renderTV(){
  const act = filas.filter(esActivo), r = resumenHoy();
  $("#tvGrid").innerHTML = cupos().map((f,i) => cardTV(i+1, f)).join("");
  $("#tvStats").innerHTML = [
    [act.filter(f => f.Estado === "EN_CURSO").length, "En curso"],
    [act.filter(f => f.Estado === "ESPERA").length, "En espera"],
    [r.n, "Atendidos hoy"],
    [r.n ? r.prom.toFixed(0) + "'" : "–", "Promedio"],
    [r.n ? r.pct + "%" : "–", "A tiempo"]
  ].map(([v,l]) => `<div class="st"><b>${v}</b><small>${l}</small></div>`).join("");
  $("#tvUlt").innerHTML = finalizadosHoy().slice(0,5).map(f => { const m = Math.round((f.FinMs - f.InicioMs)/60000), ok = m <= CONFIG.META_MIN;
    return `<span><b>${esc(f.Placa)}</b> ${m} min ${ok ? "✅" : "⛔"}</span>`; }).join("");
}
function renderDatos(){ if (modo === "asesora" && $("#puestos")) renderAsesora(); else if (modo === "tv" && $("#tvGrid")) renderTV(); }
function pantallaCompleta(){ try { document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => {}); } catch(e){} }
async function despierto(){ try { if (navigator.wakeLock) await navigator.wakeLock.request("screen"); } catch(e){} }

/* ---------------- Acciones de la asesora ---------------- */
function msg(t, err){ const m = $("#msg"); if (!m) return; m.textContent = t; m.className = "msg" + (err ? " err" : ""); }
function pintarAhora(){ versionLocal++; firma = ""; renderDatos(); tick(); }

// Guarda en segundo plano; la pantalla ya se actualizó antes (respuesta instantánea)
async function guardar(fn){
  ocupado = true;
  const el = $("#sync"); if (el){ el.className = "sync demo"; el.textContent = "Guardando…"; }
  try {
    const res = await fn();
    if (Array.isArray(res)) filas = res.filter(f => f.ID);
    sync = { ok:true, msg:"" };
  } catch(e){
    msg(e.message, true);
    if (/clave/i.test(e.message)){ setTimeout(() => { cerrarSesion(); }, 1500); }
    else { ocupado = false; ultimaLectura = 0; }
  } finally {
    ocupado = false; versionLocal++;
    pintarSync(); firma = ""; renderDatos(); tick();
  }
}
function local(id){ return filas.find(f => String(f.ID) === String(id)); }

function registrar(ev){
  ev.preventDefault();
  if (ocupado) return msg("Espera un momento, guardando…", true);
  const placa = $("#fPlaca").value.trim().toUpperCase();
  if (placa.length < 5) return msg("Escribe la placa completa.", true);
  const act = filas.filter(esActivo);
  if (act.some(f => String(f.Placa).toUpperCase() === placa)) return msg(`La placa ${placa} ya tiene cronómetro.`, true);
  if (act.length >= CONFIG.PUESTOS) return msg(`Ya hay ${CONFIG.PUESTOS} cronómetros en uso. Finaliza uno primero.`, true);
  const now = Date.now();
  const nueva = { ID:nuevoId(), Fecha:fechaTxt(now), Sede:sesion.sede, Asesora:sesion.asesora, Placa:placa, Estado:"ESPERA", RegistroMs:now, InicioMs:"", FinMs:"", HoraInicio:"", HoraFin:"", Minutos:"", Resultado:"" };
  filas.push(nueva); pintarAhora();
  $("#fPlaca").value = ""; $("#fPlaca").focus();
  msg(`✓ ${placa} registrada. Pulsa ▶ Iniciar cuando crees la OT.`);
  guardar(() => store.nuevo(nueva, sesion));
}
function cambiarLocal(id, cambios, esperado, texto){
  if (ocupado) return msg("Espera un momento, guardando…", true);
  const f = local(id); if (!f) return;
  if (esperado && f.Estado !== esperado) return;
  Object.assign(f, cambios); pintarAhora();
  if (texto) msg(texto);
  guardar(() => store.cambiar(id, cambios, esperado, sesion));
}
function iniciar(id){
  const now = Date.now(), f = local(id);
  cambiarLocal(id, { Estado:"EN_CURSO", InicioMs:now, HoraInicio:hora(now) }, "ESPERA", `▶ Cronómetro iniciado para ${f ? f.Placa : ""}.`);
}
function finalizar(id){
  const f = local(id); if (!f) return;
  if (!confirm(`¿Finalizar el servicio de ${f.Placa}?`)) return;
  const now = Date.now(), min = Math.round((now - f.InicioMs)/6000)/10;
  cambiarLocal(id, { Estado:"FINALIZADO", FinMs:now, HoraFin:hora(now), Minutos:min, Resultado: min <= CONFIG.META_MIN ? "A tiempo" : "Excedido" }, "EN_CURSO", `■ ${f.Placa} finalizada en ${fmt(now - f.InicioMs)}.`);
}
function cancelar(id){
  const f = local(id); if (!f) return;
  if (!confirm(`¿Cancelar y liberar el cupo de ${f.Placa}? No contará como atendido.`)) return;
  const now = Date.now();
  cambiarLocal(id, { Estado:"CANCELADO", FinMs:now, HoraFin:hora(now) }, null, `${f.Placa} cancelada, cupo liberado.`);
}

/* ---------------- Rutas: #inicio · #asesora · #tv/prado · #tv/calle-77 · #tv/circunvalar ---------------- */
function irA(ruta){
  const [m, x] = String(ruta || "").replace(/^#/, "").split("/");
  if (m === "tv" && sedeDeSlug(x)){
    modo = "tv"; sedeActual = sedeDeSlug(x);
  } else if (m === "asesora" && sesion){
    modo = "asesora"; sedeActual = sesion.sede;
  } else {
    modo = "inicio"; sedeActual = null;
  }
  const destino = modo === "tv" ? "#tv/" + slug(sedeActual) : "#" + modo;
  if (modo !== "inicio") ls.set("express_ruta", destino);
  if (location.hash !== destino) history.replaceState(null, "", destino);
  montar();
}
function arrancar(){
  irA(location.hash && location.hash !== "#" ? location.hash : (ls.get("express_ruta") || "#inicio"));
  if (!iniciado){
    iniciado = true;
    setInterval(tick, 1000);
    setInterval(() => {
      if (modo === "inicio" || (modo === "asesora" && document.hidden)) return;
      const base = (modo === "tv" ? CONFIG.REFRESCO_TV_SEG : CONFIG.REFRESCO_ASESORA_SEG) * 1000;
      const espera = base * Math.min(4, 1 + fallosSeguidos);             // si Google falla, consulta más despacio
      if (Date.now() - ultimaLectura >= espera){ ultimaLectura = Date.now(); refrescar(); }
    }, 1000);
    window.addEventListener("hashchange", () => { if (location.hash === "#inicio") ls.del("express_ruta"); irA(location.hash); });
    window.addEventListener("storage", e => { if (DEMO && e.key === Demo.key) refrescar(); });
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible"){ refrescar(); if (modo === "tv") despierto(); } });
  }
}
arrancar();
